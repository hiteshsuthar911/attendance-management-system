<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Verification — TCET Attendance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #0f172a;
      overflow-x: hidden;
    }

    /* Full-Screen Edge-to-Edge Layout */
    .security-container {
      display: flex;
      width: 100vw;
      min-height: 100vh;
    }

    /* Left Hero Panel */
    .hero-panel {
      flex: 1;
      background: linear-gradient(145deg, #1e3a8a 0%, #0f172a 100%);
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      width: fit-content;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 2;
    }

    .hero-badge-dot {
      width: 8px;
      height: 8px;
      background: #3b82f6;
      border-radius: 50%;
      box-shadow: 0 0 10px #3b82f6;
    }

    .hero-content {
      margin-block: auto;
      z-index: 2;
      max-width: 480px;
    }

    .hero-title {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -1.2px;
      color: #ffffff;
      margin-bottom: 18px;
    }

    .hero-sub {
      font-size: 16px;
      color: #94a3b8;
      line-height: 1.7;
    }

    .hero-footer {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 13px;
      color: #cbd5e1;
      z-index: 2;
    }

    /* Right Form Panel */
    .form-panel {
      flex: 1.1;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }

    .form-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .logo-container {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .college-logo {
      max-height: 65px;
      width: auto;
      object-fit: contain;
    }

    .form-header h2 {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
    }

    .form-header p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .code-label {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .code-display {
      font-family: 'Courier New', monospace;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 10px;
      color: #2563eb;
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 6px;
    }

    .refresh-row {
      text-align: right;
      margin-bottom: 20px;
    }

    .btn-refresh {
      background: none;
      border: none;
      color: #2563eb;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
      font-family: inherit;
    }

    .btn-refresh:hover { color: #1d4ed8; }

    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    #secMessage {
      font-size: 13.5px;
      font-weight: 600;
      min-height: 20px;
      margin-bottom: 14px;
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      font-family: 'Courier New', monospace;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 10px;
      text-align: center;
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
      outline: none;
      transition: all 0.15s;
    }

    .field input:focus {
      background: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .btn-primary, .btn-secondary {
      width: 100%;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      padding: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:hover {
      background: #1d4ed8;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: #64748b;
      border: 1.5px solid #e2e8f0;
    }

    .btn-secondary:hover { background: #f8fafc; border-color: #cbd5e1; }

    @media (max-width: 992px) {
      .hero-panel { display: none; }
      .form-panel { flex: 1; padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <div class="security-container">
    <!-- Left Hero Panel (Full Height) -->
    <div class="hero-panel">
      <div class="hero-badge">
        <span class="hero-badge-dot"></span>
        Step 2 of 2 Verification
      </div>

      <div class="hero-content">
        <h1 class="hero-title">Security Verification</h1>
        <p class="hero-sub">Enter the 6-digit security code generated for your active session to complete 2-Step Authentication.</p>
      </div>

      <div class="hero-footer">
        <div> Session Protected</div>
      </div>
    </div>

    <!-- Right Form Panel (Full Height Centered) -->
    <div class="form-panel">
      <div class="form-wrapper">
        <div class="logo-container">
          <img src="/images/tcetlogo.png" alt="TCET Logo" class="college-logo" onerror="this.style.display='none'">
        </div>

        <div class="form-header">
          <h2>Enter Security Code</h2>
          <p>Your 6-digit verification code has been generated</p>
        </div>

        <p class="code-label">Generated 6-digit code</p>
        <div class="code-display" id="codeDisplayBox">••••••</div>
        <div class="refresh-row">
          <button type="button" class="btn-refresh" id="refreshCodeBtn">↻ Refresh code</button>
        </div>

        <hr class="divider">

        <div id="secMessage"></div>

        <form id="securityForm" autocomplete="off" action="javascript:void(0);">
          <div class="field">
            <label for="inputCode">Verification Code</label>
            <input
              type="text"
              id="inputCode"
              name="inputCode"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              placeholder="000000"
              required
              autofocus
            >
          </div>

          <button type="submit" class="btn-primary" id="verifyBtn">Verify &amp; Access Dashboard</button>
          <button type="button" class="btn-secondary" id="backToLoginBtn">← Back to login</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/auth.js?v=20260813_v9"></script>
  <script src="/js/security.js?v=20260813_v9"></script>
</body>
</html>
