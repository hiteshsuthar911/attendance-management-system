<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Logs - Student</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>Student Portal</h1>
    <p>Logged in as: <b id="studentName">Loading...</b> (<span id="studentEmail">...</span>)</p>
    <p><b>Roll No:</b> <span id="studentRoll">...</span> | <b>Branch/Batch:</b> <span id="studentBranchBatch">...</span></p>
    <nav>
      <a href="/student/index.html">Overview</a>
      <a href="/student/attendance-logs.html"><b>My Attendance Logs</b></a>
      <button id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <main>
    <div class="card">
      <div class="card-title">My Subject Attendance History &amp; Filters</div>

      <div class="filter-grid">
        <div class="filter-group wide">
          <label for="filterSubject">Subject</label>
          <input type="text" id="filterSubject" placeholder="Search subject name...">
        </div>

        <div style="margin-bottom: 2px;">
          <button id="filterLogsBtn" type="button">Filter Logs</button>
        </div>
      </div>

      <div class="table-wrap">
        <table border="1" cellpadding="8" cellspacing="0" width="100%">
          <thead>
            <tr>
              <th>Date &amp; Time</th>
              <th>Subject</th>
              <th>Faculty</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="studentLogsBody">
            <tr><td colspan="4" align="center">Loading attendance logs...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>
    <p><small>&copy; 2026 Attendance System - Student Panel</small></p>
  </footer>

  <script src="/js/auth.js?v=20260813_v17"></script>
  <script src="/js/student/attendance-logs.js?v=20260813_v17"></script>
</body>
</html>
