<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - Attendance System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>Student Portal</h1>
    <p>Logged in as: <b id="studentName">Loading...</b> (<span id="studentEmail">...</span>)</p>
    <p><b>Roll No:</b> <span id="studentRoll">...</span> | <b>Branch/Batch:</b> <span id="studentBranchBatch">...</span></p>
    <nav>
      <a href="/student/index.html"><b>Overview</b></a>
      <a href="/student/attendance-logs.html">My Attendance Logs</a>
      <button id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <main>
    <div class="card">
      <div class="card-title">My Attendance Performance Overview</div>

      <div class="table-wrap">
        <table border="1" cellpadding="8" cellspacing="0" width="100%">
          <thead>
            <tr>
              <th>Total Conducted Lectures</th>
              <th>Lectures Attended</th>
              <th>Overall Percentage</th>
            </tr>
          </thead>
          <tbody>
            <tr align="center">
              <td id="statTotalLectures">0</td>
              <td id="statAttended">0</td>
              <td id="statPercentage" style="font-weight: bold; color: var(--accent);">0%</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div style="margin-top: 24px;">
        <div style="font-size: 13px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.4px;">Quick Actions</div>
        <div class="action-toolbar">
          <a href="/student/attendance-logs.html" class="btn-link" style="color: var(--accent);"><b> View Detailed Attendance Logs</b></a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p><small>&copy; 2026 Attendance System - Student Panel</small></p>
  </footer>

  <script src="/js/auth.js?v=20260813_v17"></script>
  <script src="/js/student/dashboard.js?v=20260813_v17"></script>
</body>
</html>
